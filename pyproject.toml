[project]
name = "manor"
version = "0.1.0"
description = "manor -- AI執事 v2 の core。SQLite を唯一の書き手にする執事の基盤"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    # Windows は OS が IANA の時刻帯辞書を持たないので、これが無いと標準ライブラリの
    # zoneinfo が UTC すら解決できない（2026-09-05 実機で確認: ZoneInfoNotFoundError）。
    # コードを持たないデータのみの配布物（CPython の中の人が保守）で、ADR-012 D4
    # 「ICS を解くための外部ライブラリを入れない」が禁じている類の依存ではない。
    # 環境マーカーは付けない——Linux/macOS では OS の辞書が優先されるので害が無く、
    # どの環境でも同じ振る舞いになる方が良い（ADR-012 §2 D4 改訂・2026-09-05）。
    "tzdata",
]

[project.scripts]
manor = "manor.cli:main"

[dependency-groups]
# pytest-xdist: 試験を並列で回す（2026-09-07 主人のご質問）。24コアの機械で
# 1本ずつ回していた。試験どうしは tmp_path で隔離されているので分けて走らせられる。
dev = ["pytest>=8.0", "httpx>=0.27", "pytest-xdist>=3.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 既定で並列に回す（2026-09-07 主人のご質問「試験内容を落とさずに短縮できないか」）。
# 実測（24コアの機械・1704件）: 直列 175〜380秒 → 並列 23〜24秒。
# 試験どうしは tmp_path と monkeypatch で隔離されているので、分けて走らせても
# 結果は変わらない（件数が同じことを実測で確認）。
# **1本を追いかけるときは ** で直列に戻せる（traceback が読みやすく、
# print も素通しになる）。
addopts = ["-n", "auto"]
# カテゴリの印（2026-09-07）。付けるのは tests/conftest.py の TEST_CATEGORIES 1箇所で、
# 各ファイルには書かない。 のように束で回せる。
markers = [
  "core: 中核——DB・状態機械・グラフ・射影・整合検査・台帳",
  "guard: 規約の番人——製品の振る舞いではなく書き方の規約を見張る",
  "integration: 外部連携——Slack・Notion・カレンダー",
  "web: 家庭用 Web アプリ（API・認証・画面の器）",
  "board: ダッシュボード",
  "staff: 担当——料理長・家政婦・秘書・家令",
  "presence: 姿と声——VRM の小窓・VOICEVOX・通話・声かけ",
  "night: 無人実行——夜勤・関門",
  "migration: v1 からの移行",
  "platform: 環境まわり——Windows・登録・拡張",
]
