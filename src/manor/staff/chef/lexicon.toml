# --- 調理による油の吸収（ADR-019 §4 追補・2026-09-13）。**揚げ油が材料表で数えられて
# いないとき**（「揚げ油 適量」）に、主材料の重さへ掛けて足す吸油率。主人の実測の
# ご指摘（白ごはん.com の塩唐揚げが約 450kcal/人で、ネットの目安 550〜600 より低い）
# から足した——材料表の「適量」は ADR-019 D3 で**数えない**ので、揚げて吸った油が
# まるごと落ちていた。
#
# 出典（吸油率の根拠）:
#  ① 文部科学省「日本食品標準成分表」第3章 表17「揚げ物（天ぷら、フライ等）100 g に
#     使われた生の材料、衣等の重量」（八訂増補 2023 では表13）。
#     https://www.mext.go.jp/component/a_menu/science/detail/__icsFiles/afieldfile/2016/11/08/1365334_1-0320r3.pdf
#     右欄の「脂質量の増減（生から）」を同じ行の「生の材料」の重さで割ると、
#     **生の材料に対する脂質の増え方**＝ここで言う吸油率になる（実測値）:
#       天ぷら … さつまいも 6.5%・バナメイえび 9.9%・するめいか 12.3%・なす 15.2%・きす 15.8%
#       フライ／とんかつ … 豚ロース 11.1%・まさば 11.0%・すけとうだら 12.2%・まあじ 16.6%・豚ヒレ 20.9%・まいわし 26.0%
#       から揚げ … まあじ小型 9.8%・鶏もも皮なし 4.3%・**鶏もも皮つき −0.7%**
#  ② 「調理のためのベーシックデータ 第5版」（女子栄養大学出版部）の食材別の吸油率。
#     鶏肉は 素揚げ 5%・唐揚げ（片栗粉）8%・天ぷら 15%。
#     https://oishi-kenko.com/articles/condition_fried_food
#
# ⚠ ①の「鶏もも 皮つき から揚げ」だけは**マイナス**（−0.7%）である——脂の多い肉は
# 自分の脂が揚げ油へ溶け出し、吸った油を上回ることがある（表17 の本文に明記）。
# それでもうちは②の 8% を採る: ①の実測は**から揚げ粉を 19g** まぶした重い衣の1例で、
# 家庭の「片栗粉を薄くまぶして揚げる」とは条件が違い、栄養計算で広く使われるのは②の
# 値だから。**主人が実測で書き換えてよい**（`[units]` と同じ約束）。
[nutrition.oil_absorption]
# 吸った油の栄養を引く食品番号（`chef_food`。調合油＝サラダ油の成分表上の名前）。
food_code = "14006"
# 炒め物で油が「適量」のときの仮置き（1 人前。大さじ 1 ≒ 13g）。揚げ物と違って
# 主材料の重さに比例しないので、率ではなく**人数ぶんの実量**で足す。
stir_fry_default_oil_g = 13.0
# 炒め物の型の名前（`rate` を持たず `stir_fry_default_oil_g` で足す型）。
stir_fry_method = "炒め物"
# 手がかりを探す前に文から落とす語。「フライパンで炒める」は揚げ物ではないし、
# 「油揚げ」「厚揚げ」は食材の名前であって調理法ではない。
# 「かつお（鰹）」は「カツ」の手がかりに当たってしまうので同じく落とす。
drop_words = ["フライパン", "油揚げ", "厚揚げ", "生揚げ", "揚げ出し", "かつお", "カツオ", "鰹"]
# 揚げ油として数える油の名前（**正規化して完全一致**）。ここに当たる材料が
# 量つきで書かれていれば、吸油は足さない（二重に足さないため）。ごま油・
# オリーブオイルは**入れない**——たれや風味づけの少量であることが多く、
# それを「揚げ油が書いてある」と読むと唐揚げの吸油が丸ごと落ちる。
oil_names = ["揚げ油", "サラダ油", "調合油", "油", "米油", "こめ油", "なたね油", "菜種油", "キャノーラ油", "白絞油"]
# 主材料に数えない材料（油・調味料・粉）。`[basics].items`（基礎調味料）に**足して**見る。
not_main = ["揚げ油", "パン粉", "天ぷら粉", "から揚げ粉", "唐揚げ粉", "薄力粉", "強力粉", "米粉", "コーンスターチ", "衣", "打ち粉"]

[nutrition.oil_absorption.cues]
# 調理法 → 題名・工程の文に探す語。**上から順に当て、最初に当たった型を採る**
# （`[dish_types]`・`ops.classify_dish_type` と同じ約束）ので、細かい型を先に置く。
"天ぷら" = ["天ぷら", "天麩羅", "かき揚げ", "かきあげ"]
"フライ" = ["フライ", "カツ", "とんかつ", "豚かつ", "コロッケ", "メンチ"]
"唐揚げ" = ["唐揚げ", "から揚げ", "からあげ", "竜田揚げ", "竜田"]
"素揚げ" = ["素揚げ", "揚げ"]
"炒め物" = ["炒め"]

[nutrition.oil_absorption.rate]
# 調理法 → 主材料の重さに対する吸油率（上の出典から採った。0 にすれば足さない）。
"素揚げ" = 0.04   # ②鶏肉 5%・じゃがいも 2〜5% の中ほど
"唐揚げ" = 0.08   # ②鶏肉（片栗粉）8%。①まあじ小型 9.8% とも近い
"フライ" = 0.12   # ①の実測 11.0〜26.0%（中央 14.4%）の低めを採る（衣の粉・卵を材料表で別に数えているため）
"天ぷら" = 0.13   # ①の実測 6.5〜15.8%（中央 12.3%）・②鶏肉 15% の中ほど

[nutrition.veg_groups]
# 「野菜の量」（ADR-021 D1）に数える成分表の食品群（`chef_food.food_group`）。
# 06 野菜類・08 きのこ類・09 藻類。いも（02）・果物（07）・豆（04）は数えない
# ——健康日本21 の「野菜 350 g」の数え方に寄せる。
groups = ["06", "08", "09"]
