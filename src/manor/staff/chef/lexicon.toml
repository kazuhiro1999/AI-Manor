# chef の語彙（ADR-002 §3）。定義と道具（ops.py）の唯一の出どころ。
# ここに無い語を .claude/agents/chef.md や docs/staff/chef.md に書き写さないこと。
# 材料は v1（AI執事）の agents/kitchen/lexicon.md を土台に、ADR-002 の分類名に合わせて作り直した。

[basics]
