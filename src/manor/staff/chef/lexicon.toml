# --- 献立のおすすめ（ADR-018）。**ここが採点の物差しの唯一の出どころ**——
# `menu.py` は数値を1つも持たず、すべてこの節から読む。主人が書き換えれば結果が変わる
# （体格・方針で帯は動く。ADR-018 D2）。

[menu.slots]
# 枠の名（API・画面の語）→ `chef_recipe_meta.category` の語彙（ADR-015 D9）。
# ここで対応を持つのは、`menu.py` に日本語の分類名をべた書きしないため
# （語彙の出どころは lexicon.toml だけ、という ADR-002 §3 の規則）。
main = "主菜"
side = "副菜"
soup = "汁物"

[menu.band]
# 1 食・**1 人前**の帯（ADR-018 D2）。`[下限, 上限]`。
# 食事摂取基準（2025 年版）と食事バランスガイドから 1 日の 1/3 として置いた
# （根拠は docs/reports/2026-09-13_menu-planning-research.md §2.3）。
# 塩分は下限を持たない（少ないほどよい）ので 0 を置く。
kcal = [600, 900]
protein_g = [20, 35]
fat_g = [15, 30]
carb_g = [75, 130]
salt_g = [0, 2.5]

[menu.rules]
# 採点の閾値（重みではなく「どこで線を引くか」）。
top_n = 5             # 枠ごとに返す候補の数（ADR-018 D3）
history_days = 7      # 直近何日の `chef_meal` を「最近作った」とみなすか（D4）
quick_minutes = 15    # 副菜・汁物で「早く出来る」と加点する上限（分）
expiring_days = 3     # 在庫の期限が何日以内なら「期限が近い」とみなすか
pantry_items_max = 3  # 在庫の加点を数える材料の上限（1品で頭打ちにしない・際限なく伸ばさない）
reasons_max = 3       # 1 候補につき出す理由の数（D3「1〜3 個」）

[menu.weights]
# 採点の重み（ADR-018 D4）。**帯への寄与を頭に置き、他の因子は 0.1〜0.5 の範囲で表す**
# ——順位が入れ替わった理由を「帯より在庫が勝った」のように言葉で説明できるようにする。
#
# `band` だけ桁が大きいのは、帯への寄与が「**相対**逸脱がどれだけ減るか」だからである。
# 合計が既に帯の近くにあれば、どんな候補を足しても寄与は小さい（＝そのときは在庫・気分・
# 多様性が順位を決めてよい）。逆に大きく外れている／超えているときは、この重みで帯が必ず勝つ。
band = 2.0                       # 帯からの逸脱がどれだけ減るか（相対逸脱 1.0 ぶんで 2 点）
band_kcal = 1.0                  # 帯の項目ごとの重み。kcal・たんぱく質は帯の主役
band_protein_g = 1.0
band_fat_g = 0.5                 # 脂質・炭水化物は kcal に連動するので半分
band_carb_g = 0.5
band_salt_g = 1.5                # 塩分は献立採点の主役（調査 §2.3）
salt_over = 2.0                  # 塩分の**超過**だけは帯の 2 倍で減点（D4「強く減点」）
diversity_main_ingredient = 0.5  # 主菜と主材料が被らない
diversity_dish_type = 0.4        # 主菜と調理法（題名から推定）が被らない
cuisine_match = 0.15             # ジャンルは**揃う**ほうを小さく加点（§4 参照）
pantry_item = 0.25               # 在庫にある材料 1 つにつき（加点のみ。D4）
pantry_expiring = 0.3            # そのうち期限が近いものがあれば上乗せ
history_recent = 1.0             # 直近 history_days 日に出た → 減点
history_not_recent = 0.1         # 作った記録はあるが最近ではない → 小さく加点
taste_like = 0.3                 # `chef_taste.likes` の食材が入っている
time_quick = 0.3                 # 副菜・汁物で quick_minutes 以内
rating = 0.15                    # `rating` が 3 を超えた 1 点につき
times_cooked = 0.1               # 作り慣れている（3 回以上）
favorite = 0.2                   # お気に入り
mood_match = 0.5                 # 気分の条件 1 つに合う（合わなければ同じ重みで減点）

[menu.mood]
# 気分のキーワード → 条件（ADR-018 D5。**第一段は語彙の一致だけ**——自由文の LLM 翻訳は
# 第二段）。自由文に `keywords` のどれかが含まれたら、その条件が効く。
#
# 条件の語（どれも省略可）:
#   keywords            … この気分と読む言い換え（節の名そのものも常に含む）
#   cuisine             … `chef_recipe_meta.cuisine` がこの中なら加点
#   main_ingredient     … `chef_recipe_meta.main_ingredient` がこの中なら加点
#   dish_types          … 題名から推定した調理法（`[dish_types]` の型）がこの中なら加点
#   exclude_dish_types  … 推定した調理法がこの中なら**減点**（候補からは外さない）
#   max_minutes         … `total_minutes` がこれ以内なら加点
#
# **絞り込みではなく加減点**にしてある——気分に合う候補が 1 件も無いときに画面が
# 空になるより、合うものが上に来るだけのほうが使える（D4 の在庫と同じ姿勢）。

[menu.mood."さっぱり"]
keywords = ["さっぱり", "あっさり", "軽め", "軽い", "暑い"]
cuisine = ["和食"]
dish_types = ["生", "汁物", "煮物"]
exclude_dish_types = ["揚げ物", "炒め物"]

[menu.mood."がっつり"]
keywords = ["がっつり", "しっかり", "ボリューム", "肉"]
main_ingredient = ["肉"]
dish_types = ["揚げ物", "焼き物", "炒め物"]

[menu.mood."早く"]
keywords = ["早く", "早い", "すぐ", "時短", "急ぎ", "簡単"]
max_minutes = 15

[menu.mood."温かい"]
keywords = ["温かい", "あたたかい", "温まる", "寒い"]
dish_types = ["汁物", "煮物"]

[menu.mood."野菜"]
keywords = ["野菜", "ヘルシー", "健康"]
main_ingredient = ["野菜", "きのこ"]
exclude_dish_types = ["揚げ物"]

[menu.mood."魚"]
keywords = ["魚", "魚介", "さかな"]
main_ingredient = ["魚介"]
