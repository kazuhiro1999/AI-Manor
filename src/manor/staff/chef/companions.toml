# お供の定番（ADR-021 D4）。主菜に添える副菜・汁物の「型」の一覧。
# 候補は「レシピ帳の副菜・汁物」＋「この定番」を混ぜて出す（レシピ帳にあるものを優先する）。
#
# **ここは作り方を持たない**（2026-09-25 主人「AI 生成ではなくレシピサイトのものを引用したい」）。
# 作り方はレシピサイトの候補（`companion_sources.toml`）を画面に並べ、主人が見て
# 「レシピ帳に入れる」（取り込み画面で下書きを確かめてから登録）かを決める。
# 取り込んだレシピは、うちのレシピとしてこの定番の代わりに並ぶ（出典 URL で突き合わせる）。
#
# 材料とグラムは**栄養の目安を出すためだけ**の一般的な分量（AI が書いた目安で、特定の
# レシピの引用ではない）。栄養値はここに持たず、`nutrition.estimate_nutrition()` が
# 成分表から出す（ADR-019）。主人が実測で書き換えてよい。
#
# 各行の語彙:
#   key         … ASCII の snake_case。一意・安定（画面・API・候補の一覧から指す ID）
#   title       … 料理名（一般名。サイト名・ブランド名は書かない）
#   category    … "副菜" / "汁物" のどちらか
#   kind        … 型。"生"（サラダ・和え物・酢の物・浅漬け・おひたし等、火を通さない
#                 か、さっと茹でて和えるだけのもの）/ "汁物" / "煮物" / "焼き物" /
#                 "炒め物" / "蒸し物"
#   tags        … 0〜4個。固定語彙: 酸味 生野菜 海藻 きのこ 豆 乳 卵 葉物 根菜 温野菜
#                 辛味 ごま さっぱり こってり
#   cuisine     … 和食 / 洋食 / 中華 / 韓国 / エスニック
#   minutes     … 実際にかかる総時間（分）の目安
#   heat        … "none"（火もレンジも使わない）/ "range"（電子レンジだけ）/
#                 "stove"（コンロを使う）。主菜がコンロを使っている間に作れるかの目安
#                 （ADR-021 D3）
#   servings    … 何人前の分量か（ここでは 2 に揃えている）
#   ingredients … { name, qty, unit } の並び（栄養の目安用）。qty は文字列（"1" "0.5"
#                 "1/2" 可）、unit は g / ml / 大さじ / 小さじ / カップ / 個 / 本 / 枚 /
#                 片 / 束 / 丁 / 株 / 袋 / 切れ / cm / ""（qty に「少々」等）のどれか

