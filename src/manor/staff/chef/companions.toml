# お供の定番（ADR-021 D4）。主菜に添える副菜・汁物の既定カタログ。
# レシピ帳の副菜・汁物が少ない（2026-09-25 時点で1件）ので、まずここに標準的な
# メニューを並べておく。候補は「レシピ帳の副菜・汁物」＋「この定番」を混ぜて出す
# （menu._dish_matches が題名で突き合わせ、レシピ帳にあるものを優先する）。
#
# 栄養値はここに**持たない**——`nutrition.estimate_nutrition()` が材料から成分表を引いて
# 出す（ADR-019）。数字の出どころを1つにするための割り切りで、ここに書いた材料・
# グラムが不正確だと栄養の推定も不正確になる。主人が実測で書き換えてよい。
#
# 定番は気に入ったら「レシピ帳に入れる」で `chef_recipe` に昇格できる（材料・手順を
# そのまま写す）。ここは呼び水の一覧であって、正式なレシピ帳の代わりではない。
#
# 各行の語彙:
#   key         … ASCII の snake_case。一意・安定（画面や API から指すための ID）
#   title       … 料理名（自然な日本語。サイト名・ブランド名は書かない）
#   category    … "副菜" / "汁物" のどちらか
#   kind        … 型。"生"（サラダ・和え物・酢の物・浅漬け・おひたし等、火を通さない
#                 か、さっと茹でて和えるだけのもの）/ "汁物" / "煮物" / "焼き物" /
#                 "炒め物" / "蒸し物"
#   tags        … 0〜4個。固定語彙: 酸味 生野菜 海藻 きのこ 豆 乳 卵 葉物 根菜 温野菜
#                 辛味 ごま さっぱり こってり
#   cuisine     … 和食 / 洋食 / 中華 / 韓国 / エスニック
#   minutes     … 実際にかかる総時間（分）の目安
#   heat        … "none"（火もレンジも使わない）/ "range"（電子レンジだけ）/
#                 "stove"（コンロを使う）。主菜がコンロを使っている間に作れるかの目安
#                 （ADR-021 D3）
#   servings    … 何人前の分量か（ここでは 2 に揃えている）
#   ingredients … { name, qty, unit } の並び。qty は文字列（"1" "0.5" "1/2" 可）、
#                 unit は g / ml / 大さじ / 小さじ / カップ / 個 / 本 / 枚 / 片 / 束 /
#                 丁 / 株 / 袋 / 切れ / cm / ""（qty に「少々」等）のどれか
#   steps       … 2〜4行。1行60字以内の平易な命令形

