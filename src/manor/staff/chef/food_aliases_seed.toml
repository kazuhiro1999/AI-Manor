# 名寄せの種（ADR-019 §4）。**家庭料理でよく出る材料名 → 食品番号**の対応表。
#
# なぜ持つか: 成分表（八訂増補 2023）の食品名は「根深ねぎ 葉 軟白 生」「ぶた [大型種肉]
# ばら 脂身つき 生」のような**分類の言葉**で、うちのレシピが書く「長ねぎ」「豚バラ薄切り
# 肉」とは字が重ならない。部分一致をいくら賢くしても字が無いものは当たらないので、
# **よく出る 200 語ぶんだけ先に手で結んでおく**（ADR-019 D2 ①の alias を、主人が手で
# 入れる前から埋めておく形）。
#
# 読み込み: `manor chef food seed`（`manor chef food import` の直後にも自動で走る）が
# `chef_food_alias` へ `confidence='rule'` で入れる。**`manual`（画面や CLI から主人が
# 手で決めたもの）は上書きしない**——機械の下書きが人の判断を塗り替えない（ADR-019 D4
# の「上書きしない約束」と同じ筋）。種を直して入れ直せば `rule` の行だけが更新される。
#
# 書き方:
#
#   [[food]]
#   code    = "17007"          # 成分表の食品番号（**実在するものだけ**。無ければ黙って飛ばす）
#   name    = "…"              # 控え。照合には使わない（読み手が「どの食品か」を確かめる用）
#   aliases = ["しょうゆ", …]  # 材料名。`normalize_name()` を通した形で保存される
#
# **混ぜ物**（成分表に1行では無い食品）は `code` の代わりに `codes` を書く:
#
#   [[food]]
#   codes   = [{ code = "11089", weight = 0.5 }, { code = "11163", weight = 0.5 }]
#   aliases = ["合いびき肉", …]
#
# こちらは `chef_food_alias` ではなく `chef_food_blend`（alias 1つにつき複数行）へ入り、
# 推定のときに**重みつきの加重平均**で仮想の1行を組み立てる（`nutrition.blend_row`）。
# 重みは同じ alias の中で足して 1 になるように書く（`weight` は比なので、合計が 1 でなくても
# 割り直されるが、読み手が「半々」と分かる形を保つ）。**人が `chef_food_alias` に入れた
# 同じ alias があればそちらが勝つ**——混ぜ物は「1対1では表せないものの受け皿」。
#
# `aliases` は**正規化した後に重ならないように**書く（`[food_normalize]` が「薄切り」を
# 落とし「しょうゆ」を「醤油」へ寄せた**後**の形が鍵になる。`tests/staff/
# test_chef_nutrition_seed.py` が重複を検算している）。逆に言うと、`[food_normalize]` が
# 吸収してくれる揺れ（人参／ニンジン／にんじん）はここに並べる必要がない——**残る揺れ**
# （「玉葱」「白ネギ」「鶏胸肉」のような、語彙表に無い漢字・カナの書き方）だけを書く。
#
# 選び方の約束: 迷ったら「生」「皮つき」「脂身つき」——**買ってきた姿**の行を採る
# （調理で減る水分・落ちる脂は献立の側で見ない。ADR-019 D2 ③の「生を優先」と同じ判断）。

